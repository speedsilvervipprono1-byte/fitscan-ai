<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitScan AI - Quét Dinh Dưỡng Thông Minh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-camera-retro"></i> FitScan AI
      </h1>
      <span class="text-xs bg-emerald-700 px-2.5 py-1 rounded-full font-medium">v2.0 Connected</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto w-full p-4 flex-1 flex flex-col gap-5">

    <!-- Camera / Image Upload Section -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-gray-700">
        <i class="fa-solid fa-expand text-emerald-600"></i> Quét món ăn / Chọn ảnh
      </h2>

      <!-- Viewport Display -->
      <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center mb-4 border">
        <!-- Live Webcam Video -->
        <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover hidden"></video>
        
        <!-- Image Preview -->
        <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Ảnh xem trước">

        <!-- Initial Placeholder -->
        <div id="placeholderText" class="text-center text-gray-400 p-4">
          <i class="fa-solid fa-cloud-arrow-up text-4xl mb-2"></i>
          <p class="text-sm">Mở camera hoặc tải ảnh món ăn lên</p>
        </div>

        <!-- Camera Error Alert Box -->
        <div id="camError" class="absolute inset-0 bg-gray-900/90 text-white p-4 text-center flex flex-col items-center justify-center hidden">
          <i class="fa-solid fa-triangle-exclamation text-yellow-400 text-3xl mb-2"></i>
          <p id="camErrorText" class="text-xs text-gray-300"></p>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="grid grid-cols-2 gap-3 mb-3">
        <button onclick="startCamera()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition">
          <i class="fa-solid fa-video"></i> Bật Camera
        </button>
        
        <label class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-sm transition text-center">
          <i class="fa-solid fa-image"></i> Chọn ảnh
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        </label>
      </div>

      <button id="analyzeBtn" onclick="analyzeFoodImage()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow transition disabled:opacity-50" disabled>
        <i class="fa-solid fa-wand-magic-sparkles"></i> Phân Tích Dinh Dưỡng
      </button>
    </div>

    <!-- Quick Sample Buttons (Test Khẩn Cấp) -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">
        Hoặc dùng thử món mẫu nhanh:
      </h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="selectSample('Pho Bo')" class="text-xs bg-emerald-50 text-emerald-700 font-medium px-3 py-2 rounded-lg border border-emerald-200 hover:bg-emerald-100">
          🍜 Phở Bò
        </button>
        <button onclick="selectSample('Com Tam')" class="text-xs bg-emerald-50 text-emerald-700 font-medium px-3 py-2 rounded-lg border border-emerald-200 hover:bg-emerald-100">
          🍚 Cơm Tấm
        </button>
        <button onclick="selectSample('Ga Luoc')" class="text-xs bg-emerald-50 text-emerald-700 font-medium px-3 py-2 rounded-lg border border-emerald-200 hover:bg-emerald-100">
          🍗 Gà Luộc
        </button>
      </div>
    </div>

    <!-- Results Display Section -->
    <div id="resultBox" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-200 hidden">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-chart-pie text-emerald-600"></i> Kết Quả Phân Tích
      </h2>
      
      <div id="loadingSpinner" class="text-center py-8 hidden">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-600 mb-2"></i>
        <p class="text-sm text-gray-500 font-medium">AI đang phân tích khẩu phần ăn...</p>
      </div>

      <div id="analysisContent" class="space-y-4"></div>
    </div>

  </main>

  <script>
    let currentStream = null;
    let selectedBase64Image = null;

    // Helper Display Functions
    function showElement(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function hideElement(id) { document.getElementById(id)?.classList.add('hidden'); }

    // Start Live Camera
    async function startCamera() {
      hideElement('imagePreview');
      hideElement('placeholderText');
      hideElement('camError');
      showElement('webcamVideo');

      const video = document.getElementById('webcamVideo');

      try {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = currentStream;
        document.getElementById('analyzeBtn').disabled = false;
      } catch (err) {
        console.error("Camera Error:", err);
        hideElement('webcamVideo');
        showElement('camError');
        document.getElementById('camErrorText').textContent = 
          "Không thể bật Camera trực tiếp. Hãy kiểm tra quyền truy cập hoặc bấm 'Chọn ảnh' bên cạnh.";
      }
    }

    // Handle Image Upload File
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        
        hideElement('webcamVideo');
        hideElement('placeholderText');
        hideElement('camError');
        showElement('imagePreview');

        selectedBase64Image = e.target.result.split(',')[1];
        document.getElementById('analyzeBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // Sample Selection Fallback
    function selectSample(foodType) {
      showElement('resultBox');
      showElement('loadingSpinner');
      document.getElementById('analysisContent').innerHTML = '';

      setTimeout(() => {
        hideElement('loadingSpinner');
        let data = {};
        if (foodType === 'Pho Bo') {
          data = { name: "Phở Bò Tái", calories: "450 kcal", protein: "25g", carbs: "55g", fat: "12g", advice: "Nên ăn bớt nước dùng nếu muốn giảm natri và mỡ dư thừa." };
        } else if (foodType === 'Com Tam') {
          data = { name: "Cơm Tấm Sườn Nuống", calories: "620 kcal", protein: "30g", carbs: "70g", fat: "22g", advice: "Lượng calo khá cao, nên ăn kèm nhiều dưa leo, cà chua để tăng chất xơ." };
        } else {
          data = { name: "Gà Luộc Lá Chanh", calories: "320 kcal", protein: "38g", carbs: "0g", fat: "18g", advice: "Món ăn giàu protein tuyệt vời cho người tập gym, nên bỏ da gà để giảm mỡ." };
        }

        document.getElementById('analysisContent').innerHTML = `
          <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
            <h3 class="text-xl font-bold text-emerald-800">${data.name}</h3>
            <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
              <div class="bg-white p-2 rounded shadow-sm"><b>Calo:</b> ${data.calories}</div>
              <div class="bg-white p-2 rounded shadow-sm"><b>Protein:</b> ${data.protein}</div>
              <div class="bg-white p-2 rounded shadow-sm"><b>Carbs:</b> ${data.carbs}</div>
              <div class="bg-white p-2 rounded shadow-sm"><b>Fat:</b> ${data.fat}</div>
            </div>
            <p class="text-xs text-emerald-700 mt-3"><b>Gợi ý:</b> ${data.advice}</p>
          </div>
        `;
      }, 800);
    }

    // Call Gemini Serverless Backend Function
    async function analyzeFoodImage() {
      showElement('resultBox');
      showElement('loadingSpinner');
      document.getElementById('analysisContent').innerHTML = '';

      try {
        let base64Data = selectedBase64Image;

        // If taking snapshot directly from camera
        if (!base64Data && currentStream) {
          const video = document.getElementById('webcamVideo');
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          base64Data = canvas.toDataURL('image/jpeg').split(',')[1];
        }

        if (!base64Data) {
          alert("Vui lòng bật camera hoặc chọn một bức ảnh trước!");
          hideElement('loadingSpinner');
          return;
        }

        // Call Serverless Function on Vercel
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: base64Data })
        });

        const result = await response.json();
        hideElement('loadingSpinner');

        if (!response.ok) {
          throw new Error(result.error || 'Không thể phân tích ảnh.');
        }

        document.getElementById('analysisContent').innerHTML = `
          <div class="prose max-w-none text-sm leading-relaxed text-gray-700 bg-gray-50 p-4 rounded-xl border">
            ${result.text.replace(/\n/g, '<br>')}
          </div>
        `;

      } catch (err) {
        hideElement('loadingSpinner');
        document.getElementById('analysisContent').innerHTML = `
          <div class="text-red-500 bg-red-50 p-3 rounded-xl border border-red-200 text-sm">
            <b>Lỗi:</b> ${err.message}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
